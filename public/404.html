<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page Not Found — DIGITCH</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#10B981;--bg:#0C0C0C;--bg2:#141414;--bg3:#1E1E1E;
  --text:#F2F2F2;--text-muted:#71717A;--border:rgba(255,255,255,.08);
  --radius:14px;--shadow:0 4px 32px rgba(0,0,0,.4);
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:2.5rem 2rem;max-width:440px;width:100%;text-align:center;
  box-shadow:var(--shadow);
}
.code{
  font-family:'Syne',sans-serif;font-weight:800;font-size:4.5rem;line-height:1;
  color:var(--accent);letter-spacing:-.02em;margin-bottom:.5rem;
}
h1{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:.5rem}
p{font-size:.92rem;color:var(--text-muted);line-height:1.6;margin-bottom:1.5rem}
.btn{
  display:inline-flex;align-items:center;gap:.5rem;
  background:var(--accent);color:#fff;font-weight:700;font-size:.9rem;
  padding:.8rem 1.6rem;border-radius:9px;border:none;cursor:pointer;
  text-decoration:none;transition:opacity .15s;
}
.btn:hover{opacity:.88}
.btn.outline{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
.divider{height:1px;background:var(--border);margin:1.5rem 0}
.search-box{
  display:flex;gap:.5rem;background:var(--bg3);border:1px solid var(--border);
  border-radius:9px;padding:.4rem;margin-bottom:1.5rem;
}
.search-box input{
  flex:1;background:transparent;border:none;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:.85rem;padding:.5rem .6rem;outline:none;
}
.search-box input::placeholder{color:var(--text-muted)}
.search-box button{
  background:var(--accent);border:none;color:#fff;border-radius:6px;
  padding:.5rem .9rem;cursor:pointer;display:flex;align-items:center;
}
</style>
</head>
<body>
<div class="card">
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist, may have been moved, or the link is broken.</p>

  <div class="search-box">
    <input id="search-input" type="text" placeholder="Search courses & packs…" />
    <button id="search-btn" aria-label="Search">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    </button>
  </div>

  <a class="btn" href="/">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
    Back to Home
  </a>
  <br/><br/>
  <a class="btn outline" href="/?open=my-products">View My Learning</a>
</div>

<script>
  document.getElementById('search-btn').addEventListener('click', goSearch);
  document.getElementById('search-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') goSearch();
  });
  function goSearch(){
    const q = document.getElementById('search-input').value.trim();
    window.location.href = q ? `/?search=${encodeURIComponent(q)}` : '/';
  }
</script>
</body>
</html>
